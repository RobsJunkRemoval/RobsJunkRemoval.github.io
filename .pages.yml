media:
  input: images
  output: /images

content:
  - name: gallery
    label: Before & After Photos
    type: collection
    path: gallery
    format: json
    fields:
      - name: title
        label: Job Title
        type: string
        required: true
      - name: before
        label: Before Photos
        type: image
        options:
          multiple:
            max: 20
          unique: true
          rename: true
      - name: after
        label: After Photos
        type: image
        options:
          multiple:
            max: 20
          unique: true
          rename: true
      - name: description
        label: Description
        type: text
